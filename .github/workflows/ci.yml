name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estoque
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/estoque
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/estoque
      JWT_SECRET: chave-de-teste-usada-somente-no-pipeline-de-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Aplicar migrations
        run: alembic upgrade head

      - name: Desfazer e reaplicar migrations
        run: alembic downgrade base && alembic upgrade head

      - name: Rodar testes
        run: pytest -v
